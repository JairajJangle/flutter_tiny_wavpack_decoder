name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.35.7

jobs:
  analyze:
    name: Analyze, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test test/unit

  host-ffi:
    name: FFI tests vs real C (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build host native library
        run: bash tool/build_host_lib.sh
      - name: Check exported symbol (macOS)
        if: runner.os == 'macOS'
        run: nm -gU build/host/libflutter_tiny_wavpack_decoder.dylib | grep ftwd_decode
      - name: Run FFI integration tests
        run: flutter test test/ffi

  example-android:
    name: Example builds (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
        working-directory: example

  example-apple:
    name: Example builds (${{ matrix.platform }}, ${{ matrix.integration }}, Flutter ${{ matrix.flutter }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
        integration: [swiftpm, cocoapods]
        flutter: ['3.35.7']
        include:
          # Latest stable, where SwiftPM is on by default (Flutter 3.44+).
          - platform: ios
            integration: swiftpm
            flutter: any
          - platform: macos
            integration: swiftpm
            flutter: any
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      # The example opts into SwiftPM in its pubspec; flipping it off covers
      # the deprecated podspec that apps still on CocoaPods build through.
      - name: Use CocoaPods instead of SwiftPM
        if: matrix.integration == 'cocoapods'
        run: sed -i '' 's/enable-swift-package-manager: true/enable-swift-package-manager: false/' example/pubspec.yaml
      - name: Build (iOS)
        if: matrix.platform == 'ios'
        run: flutter build ios --debug --no-codesign
        working-directory: example
      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: flutter build macos --debug
        working-directory: example
      # SwiftPM ships the plugin as its own dynamic framework (named after
      # the dashed product) so Dart's dlsym lookups survive release stripping;
      # CocoaPods names it after the pod. Fail if either layout regresses.
      - name: Verify plugin framework layout
        run: |
          if [ '${{ matrix.integration }}' = swiftpm ]; then fw=flutter-tiny-wavpack-decoder; else fw=flutter_tiny_wavpack_decoder; fi
          if [ '${{ matrix.platform }}' = ios ]; then
            bin="example/build/ios/iphoneos/Runner.app/Frameworks/$fw.framework/$fw"
          else
            app=(example/build/macos/Build/Products/Debug/*.app)
            bin="${app[0]}/Contents/Frameworks/$fw.framework/$fw"
          fi
          nm -gU "$bin" | grep ftwd_decode

  example-web:
    name: Example builds (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build web --release
        working-directory: example
      # The WASM decoder and its worker script must land in the built bundle.
      - name: Verify web decoder assets are bundled
        run: |
          test -f example/build/web/assets/packages/flutter_tiny_wavpack_decoder/web_assets/ftwd.wasm
          test -f example/build/web/assets/packages/flutter_tiny_wavpack_decoder/web_assets/ftwd.js
          test -f example/build/web/assets/packages/flutter_tiny_wavpack_decoder/web_assets/ftwd_worker.js

  publish-dry-run:
    name: pub.dev dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub publish --dry-run
